name: lint

on:
  pull_request:
  push:
    branches: main

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned so a new release's style changes don't fail unrelated PRs
      - run: pip install black==26.10.1 pylint==4.1.3 . pytest
      - run: black --check friendlycells tests
      - run: pylint friendlycells tests

  r:
    runs-on: ubuntu-latest
    container: rocker/r-ver:4.6
    defaults:
      run:
        working-directory: R
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: styler@1.11.0
          # Distable Quarto installation, which needs curl and jq
          install-quarto: false
          install-pandoc: false
      - run: styler::style_pkg(dry = "fail")
        shell: Rscript {0}
