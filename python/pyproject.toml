[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "friendlyspots"
version = "0.1.0"
description = "Spatial similarity of spatial transcriptomics samples"
readme = "README.md"
authors = [{ name = "George Hall", email = "george.hall@ucl.ac.uk" }]
requires-python = ">=3.9"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = ["numpy", "pandas"]

[project.urls]
Homepage = "https://github.com/george-hall-ucl/friendlyspots"
Issues = "https://github.com/george-hall-ucl/friendlyspots/issues"

[tool.setuptools]
packages = ["friendlyspots"]

[tool.pytest.ini_options]
pythonpath = ["."]
