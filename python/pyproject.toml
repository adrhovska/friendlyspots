[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "friendlycells"
version = "0.1.0"
description = "Spatial similarity of spatial transcriptomics samples"
readme = "README.md"
authors = [
    { name = "George Hall", email = "george.hall@ucl.ac.uk" },
    { name = "Sergi Castellano", email = "s.castellano@ucl.ac.uk" },
]
maintainers = [{ name = "George Hall", email = "george.hall@ucl.ac.uk" }]
requires-python = ">=3.9"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = ["numpy", "pandas", "scipy"]

[project.urls]
Homepage = "https://github.com/george-hall-ucl/friendlycells"
Issues = "https://github.com/george-hall-ucl/friendlycells/issues"

[tool.setuptools]
packages = ["friendlycells"]

[tool.pytest.ini_options]
pythonpath = ["."]
